<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default('Blockchain Analysis') }}</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; background-color: #f0f0f0; padding: 10px; border-radius: 5px;}
        nav a { margin-right: 15px; text-decoration: none; color: #333; }
        nav a:hover { text-decoration: underline; }
        .content { margin-top: 20px; }
        .error { color: red; border: 1px solid red; padding: 10px; margin-bottom: 15px; }
        pre { background-color: #eee; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('main.index') }}">Dashboard</a>
        <a href="{{ url_for('main.static_analysis') }}">Static Analysis</a>
        <a href="{{ url_for('main.usage_analysis') }}">Usage Analysis</a>
        <a href="{{ url_for('main.congestion_analysis') }}">Congestion Analysis</a>
        <a href="{{ url_for('main.safe_period_analysis') }}">Safe Period Analysis</a>
    </nav>

    <h1>{{ title | default('Blockchain Analysis') }}</h1>

    {% if error %}
        <div class="error">
            <strong>Error:</strong> {{ error }}
        </div>
    {% endif %}

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    
</body>
</html>
